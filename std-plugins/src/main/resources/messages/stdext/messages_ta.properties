feedback.extra.suggestions.addAnotherWord=மற்றொரு சொல் அல்லது இரண்டைச் சேர்க்கவும். அசாதாரண சொற்கள் சிறந்தவை.
feedback.default.suggestions.useFewWords=சில சொற்களைப் பயன்படுத்துங்கள், பொதுவான சொற்றொடர்களைத் தவிர்க்கவும்.
feedback.default.suggestions.noNeedSymbols=சின்னங்கள், இலக்கங்கள் அல்லது பெரிய எழுத்துக்கள் தேவையில்லை.
feedback.dictionary.warning.passwords.top10=இது ஒரு சிறந்த -10 பொதுவான கடவுச்சொல்.
feedback.dictionary.warning.passwords.top100=இது முதல் -100 பொதுவான கடவுச்சொல்.
feedback.dictionary.warning.passwords.veryCommon=இது மிகவும் பொதுவான கடவுச்சொல்.
feedback.dictionary.warning.passwords.similar=இது பொதுவாகப் பயன்படுத்தப்படும் கடவுச்சொல்லைப் போன்றது.
feedback.dictionary.warning.englishWikipedia.itself=ஒரு சொல் தானே யூகிக்க எளிதானது.
feedback.dictionary.warning.etc.namesThemselves=பெயர்கள் மற்றும் குடும்பப்பெயர்கள் தங்களைத் தாங்களே யூகிக்க எளிதானது.
feedback.dictionary.warning.etc.namesCommon=பொதுவான பெயர்கள் மற்றும் குடும்பப்பெயர்கள் யூகிக்க எளிதானது.
feedback.dictionary.suggestions.capitalization=மூலதனமயமாக்கல் மிகவும் உதவாது.
feedback.dictionary.suggestions.allUppercase=ஆல்-பெர்ச்பேச் அனைத்து-குறைந்த கேசைப் போலவே யூகிக்க எளிதானது.
feedback.dictionary.suggestions.reversed=தலைகீழ் சொற்கள் யூகிக்க மிகவும் கடினமாக இல்லை.
feedback.dictionary.suggestions.l33t='A' க்கு பதிலாக '@' போன்ற கணிக்கக்கூடிய மாற்றீடுகள் அதிகம் உதவாது.
feedback.spatial.warning.straightRowsOfKeys=விசைகளின் நேராக வரிசைகள் யூகிக்க எளிதானது.
feedback.spatial.warning.shortKeyboardPatterns=குறுகிய விசைப்பலகை வடிவங்களை யூகிக்க எளிதானது.
feedback.spatial.suggestions.UseLongerKeyboardPattern=அதிக திருப்பங்களுடன் நீண்ட விசைப்பலகை வடிவத்தைப் பயன்படுத்தவும்.
feedback.regex.warning.recentYears=அண்மைக் கால ஆண்டுகள் யூகிக்க எளிதானது.
feedback.regex.suggestions.avoidRecentYears=அண்மைக் கால ஆண்டுகளைத் தவிர்க்கவும், உங்களுடன் தொடர்புடைய ஆண்டுகளைத் தவிர்க்கவும்.
feedback.date.warning.dates=தேதிகள் பெரும்பாலும் யூகிக்க எளிதானவை.
feedback.repeat.warning.likeAAA="AAA" போன்ற மறுபடியும் யூகிக்க எளிதானது.
feedback.repeat.warning.likeABCABCABC="ABCABCABC" போன்ற மறுபடியும் "ஏபிசி" ஐ விட யூகிக்க சற்று கடினம்.
feedback.repeat.suggestions.avoidRepeatedWords=மீண்டும்நிகழும் சொற்களையும் எழுத்துகளையும் தவிர்.
feedback.date.suggestions.avoidDates=உங்களுடன் தொடர்புடைய தேதிகள் மற்றும் ஆண்டுகளைத் தவிர்க்கவும்.
