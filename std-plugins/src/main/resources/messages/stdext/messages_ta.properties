MessageTemplateConsumer.EmailPasswordReset.desc=உறுதிப்படுத்தல் குறியீட்டைக் கொண்டு மின்னஞ்சல் செய்தி, கடவுச்சொல் மீட்டமைப்பு கோரப்படும் போது அனுப்பப்பட்டது
MessageTemplateConsumer.MobilePasswordReset.desc=உறுதிப்படுத்தல் குறியீட்டைக் கொண்ட எச்எம்எச் செய்தி, கடவுச்சொல் மீட்டமைப்பு கோரப்படும் போது அனுப்பப்பட்டது
MessageTemplateConsumer.PasswordReset.var.user=கோரிக்கையாளரின் பயனர்பெயர்
MessageTemplateConsumer.PasswordReset.var.code=கடவுச்சொல் மீட்டமைப்பு உரையாடலில் உள்ளிட வேண்டிய குறியீடு
MessageTemplateConsumer.SMSAuthn.desc=எச்எம்எச் நற்சான்றிதழுடன் அங்கீகரிக்கும் போது உரை செய்தி பயன்படுத்தப்படுகிறது
MessageTemplateConsumer.SMSAuthn.var.user=பயனர்பெயர்
MessageTemplateConsumer.SMSAuthn.var.code=அங்கீகார உரையாடலில் குறியீடு உள்ளிடப்பட வேண்டும்
X500Identity.name=புகழ்பெற்ற பெயர்
X500Identity.description=X.500 பெயர் அல்லது ஒரு புகழ்பெற்ற பெயர் (டி.என்). TLS/SSL அங்கீகாரத்தில் பயன்படுத்தப்படுகிறது. ஒரு நிகர் டி.என் இன் நியமன வடிவத்தில் சோதிக்கப்படுகிறது.
UsernameIdentity.name=பயனர்பெயர்
UsernameIdentity.description=பயனர்பெயர், எளிய சரம் சமத்துவத்துடன் ஒப்பிடும்போது. இந்த வகை அடையாளத்தை ஒற்றுமையில் உள்ள அனைத்து கடவுச்சொல் போன்ற அங்கீகாரங்களுக்கும் பயன்படுத்தலாம்.
EmailIdentity.name=மின்னஞ்சல் முகவரி
TargetedPersistentIdentity.description=தானாக ஒதுக்கப்பட்ட அநாமதேய அடையாளங்காட்டி. ஒவ்வொரு ஒற்றுமை வாடிக்கையாளர்களுக்கும் (இலக்குகள்) வேறுபட்ட அடையாளங்காட்டி பராமரிக்கப்படுவதால் இது தொடர்ச்சியான வகையிலிருந்து வேறுபட்டது. 
PersistentIdentity.name=அநாமதேய அடையாளங்காட்டி 
PersistentIdentity.description=தானாக ஒதுக்கப்பட்ட அநாமதேய அடையாளங்காட்டி. ஒவ்வொரு நிறுவனத்திற்கும் அதன் வாழ்நாளில் மாறாமல் இருக்க வேண்டும் (இது கைமுறையாக அகற்றப்படாவிட்டால்).
PersistentIdentity.anonymous=அநாமதேய அடையாளங்காட்டி
TransientIdentity.name=தற்காலிக அநாமதேய அடையாளங்காட்டி  
TransientIdentity.description=தானாக ஒதுக்கப்பட்ட அநாமதேய அடையாளங்காட்டி. இது இலக்கு வைக்கப்பட்டவுடன் மிகவும் ஒத்திருக்கிறது, ஒரே வேறுபாடு என்னவென்றால், ஒவ்வொரு உள்நுழைவு அமர்வுக்கும் அடையாளங்காட்டி மீண்டும் உருவாக்கப்படுகிறது.
TransientIdentity.random=முழு அநாமதேய, தற்காலிக அடையாளங்காட்டி
IdentifierIdentity.description=பொதுவான அடையாளங்காட்டி, சரம் சமத்துவத்துடன் ஒப்பிடும்போது. தொலைதூர ஒதுக்கப்பட்ட பயனர் அடையாளங்காட்டிகளைக் குறிக்கவும், அடுத்தடுத்த அங்கீகாரங்களின் போது அவற்றுடன் பொருந்தவும் இது பயனுள்ளதாக இருக்கும். இந்த அடையாள வகையுடன் நேரடியாக உள்நுழைய முடியாது.
