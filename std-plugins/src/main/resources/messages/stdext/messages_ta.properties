EmailIdentity.description=எளிய சரம் சமத்துவத்துடன் ஒப்பிடும்போது மின்னஞ்சல் முகவரி அடையாளம். இந்த வகை அடையாளத்தை ஒற்றுமையில் உள்ள அனைத்து கடவுச்சொல் போன்ற அங்கீகாரங்களுக்கும் பயன்படுத்தலாம். இந்த அடையாளத்தின் மதிப்பு உறுதிப்படுத்தல் செயல்முறைக்கு உட்பட்டது.
