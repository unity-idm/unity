getEntityObsolete.summary=Resolve an identity
getEntityObsolete.description=Resolves an identity type and value to its entity. Prefer the entity resource with identityType for new clients.
getEntity.summary=Read an entity
getEntity.description=Returns entity information, identities and public credential state. Without identityType, a 36-character identifier is treated as a persistent ID; other identifiers must be numeric entity IDs.
removeEntity.summary=Remove an entity
removeEntity.description=Removes the addressed entity and its associated data, subject to administrative authorization.
scheduleRemoval.summary=Schedule removal requested by a user
scheduleRemoval.description=Schedules entity removal at the supplied Unix time in milliseconds.
scheduleOperation.summary=Schedule an administrative operation
scheduleOperation.description=Schedules an entity operation at the supplied Unix time in milliseconds. The operation name is case-sensitive.
clearScheduledOperation.summary=Clear an entity's scheduled operation
clearScheduledOperation.description=Clears the scheduled operation and removal status. An entity restricted to login is restored through the engine's removal-status handling.
changeEntityStatus.summary=Change entity status
changeEntityStatus.description=Changes the entity state using a case-sensitive Unity entity state name.
addEntity.summary=Create an entity with an identity
addEntity.description=Creates a valid entity using the identity type, value and credential requirement. Returns a JSON entityId with status 200.
addIdentity.summary=Add an identity to an entity
addIdentity.description=Adds the supplied identity to the addressed entity. Identity values are interpreted by the configured identity type.
removeIdentity.summary=Remove an identity
removeIdentity.description=Removes the identity identified by its type, value and optional target and realm.
getGroups.summary=List an entity's groups
getGroups.description=Returns an array of group paths in which the entity is a member.
getAttributes.summary=Read an entity's attributes
getAttributes.description=Returns attributes in one group, defaulting to the root. Effective attributes are included by default. Null or empty externalized metadata fields are omitted. includeSimpleValues adds values converted for external consumption.
getAttributesInAllGroups.summary=Read all directly assigned attributes
getAttributesInAllGroups.description=Returns directly assigned attributes grouped by their group path. Map keys are paths, including the root slash.
getGroupMembersWithSelectedAttributes.summary=Read group members with selected attributes
getGroupMembersWithSelectedAttributes.description=Returns group members and the selected attributes. A group path without a leading slash is normalized to an absolute path.
getMultiGroupsMembersInGroupsWithSelectedAttributes.summary=Read selected attributes across groups
getMultiGroupsMembersInGroupsWithSelectedAttributes.description=Returns members keyed by requested group paths. Repeated groups and attributes query parameters select the input. Omitting groups returns an empty JSON object.
getEntityWithAttributes.summary=Read an entity record with group attributes
getEntityWithAttributes.description=Returns the entity, its memberships and attributes matching group patterns. Effective attributes default to true; an absent pattern list selects all groups using /**.
getAttributesInGroups.summary=Read attributes matching group patterns
getAttributesInGroups.description=Returns attributes grouped by path for the supplied group patterns. Effective attributes default to true.
removeAttribute.summary=Remove an entity attribute
removeAttribute.description=Removes the named attribute from the selected group, defaulting to the root group.
setAttribute.summary=Set an entity attribute
setAttribute.description=Sets an attribute while suppressing confirmation. Invalid attribute JSON uses the historical JSONParsingException error envelope.
setAttributes.summary=Set multiple entity attributes
setAttributes.description=Parses the complete array before setting attributes in sequence. The operation does not promise rollback if a later attribute fails engine validation.
setCredentialByAdmin.summary=Set a credential as an administrator
setCredentialByAdmin.description=Passes the raw request body to the configured credential handler. Its content is plugin-specific and is not parsed by the REST resource, even when Content-Type is application/json.
setCredentialByUser.summary=Set a credential from an array
setCredentialByUser.description=Requires a nonempty JSON array and uses the first element as the new secret. The existing transport converts that element to text and ignores subsequent elements.
setCredentialStatus.summary=Change credential status
setCredentialStatus.description=Changes the public state of the named credential using a case-sensitive local credential state.
set2ndFactorOptIn.summary=Set second-factor opt-in
set2ndFactorOptIn.description=Sets the user's opt-in flag for second-factor authentication.
get2ndFactorOptIn.summary=Read second-factor opt-in
get2ndFactorOptIn.description=Returns a JSON boolean indicating whether the user opted into second-factor authentication.
getGroupMeta.summary=Read group metadata
getGroupMeta.description=Returns group metadata, including delegation configuration, localized names, attribute statements and properties. Encode path separators inside the path parameter.
getGroupContents.summary=Read group contents
getGroupContents.description=Returns the group's subgroups and memberships. Metadata is included only as supplied by the engine for this query.
removeGroup.summary=Remove a group
removeGroup.description=Removes a group. recursive defaults to false; enable it to remove descendants.
addInitializedGroup.summary=Create a group with metadata
addInitializedGroup.description=Creates a group from its metadata. Legacy JSON request media types, including text/plain and an omitted Content-Type, remain accepted.
updateGroup.summary=Update group metadata
updateGroup.description=Updates the group selected by the path field in the body. Legacy JSON request media types remain accepted.
addGroup.summary=Create a group by path
addGroup.description=Creates a group using default metadata. withParents defaults to false; enable it to create missing ancestors.
addGroups.summary=Create multiple groups
addGroups.description=Creates the supplied groups as a set. Invalid JSON or an invalid array shape uses the historical WrongArgumentException response.
getGroupStatements.summary=Read group attribute statements
getGroupStatements.description=Returns the group's attribute statements in their stored order.
updateGroupStatements.summary=Replace group attribute statements
updateGroupStatements.description=Replaces all statements on the selected group. The complete JSON array is parsed before updating group metadata.
removeMember.summary=Remove a group member
removeMember.description=Removes the addressed entity from the selected group.
addMember.summary=Add a group member
addMember.description=Adds the entity to the selected group and to missing ancestor memberships in parent-first order.
getAttributeTypes.summary=List attribute types
getAttributeTypes.description=Returns the attribute type definitions visible to the administrator, including syntax configuration and constraints.
addAttributeType.summary=Create an attribute type
addAttributeType.description=Creates an attribute type from its definition. Parsing failures preserve the admin InternalException behavior.
updateAttributeType.summary=Update an attribute type
updateAttributeType.description=Updates an existing attribute type from its definition.
removeAttributeType.summary=Remove an attribute type
removeAttributeType.description=Removes the named attribute type. withInstances defaults to false and controls removal of assigned instances.
resendConfirmationForAttribute.summary=Resend an attribute confirmation
resendConfirmationForAttribute.description=Triggers confirmation for the selected entity attribute in the selected group, subject to the configured confirmation facilities.
userNotificationTrigger.summary=Send a user notification
userNotificationTrigger.description=Triggers the configured message template for the entity selected by identityValue and optional identityType. Without identityType, use a numeric entity ID or persistent ID. Custom template variables can be supplied as query parameters using the template variable prefix; repeated values are concatenated. Delivery uses the configured Unity facilities.
resendConfirmationForIdentity.summary=Resend an identity confirmation
resendConfirmationForIdentity.description=Triggers a confirmation message for the identity's type and value. An unknown identity is rejected.
getEndpoints.summary=List deployed endpoints
getEndpoints.description=Returns deployed endpoints with their configuration, resolved authentication realms and endpoint type information.
undeployEndpoint.summary=Undeploy an endpoint
undeployEndpoint.description=Undeploys the named endpoint. Undeploying the current endpoint can interrupt the client connection.
deployEndpoint.summary=Deploy an endpoint
deployEndpoint.description=Deploys an endpoint of the requested type at the supplied address using the request configuration. Returns the resolved endpoint with status 200.
updateEndpoint.summary=Update endpoint configuration
updateEndpoint.description=Updates the named endpoint. The engine preserves existing entries that are omitted from a partial configuration.
getRegistrationForms.summary=List registration forms
getRegistrationForms.description=Returns complete registration forms with their legacy mixed-case field names and layout clazz discriminators.
removeRegistrationForm.summary=Remove a registration form
removeRegistrationForm.description=Removes the form. dropRequests defaults to false; true also removes requests attached to the form.
addForm.summary=Create a registration form
addForm.description=Creates a registration form from the complete JSON definition. Invalid input preserves the admin IllegalArgumentException message.
updateForm.summary=Update a registration form
updateForm.description=Updates a registration form. ignoreRequestsAndInvitations defaults to false and allows changes despite pending requests and invitations. The historical ignoreInvitations parameter is accepted but unused.
getRegistrationRequests.summary=List registration requests
getRegistrationRequests.description=Returns flattened registration request states, including collected input, administrative comments and millisecond timestamps. CreatedEntityId is omitted when unavailable.
getRegistrationRequest.summary=Read a registration request
getRegistrationRequest.description=Returns a request selected from the stored registration requests. An unknown request ID returns 400 with WrongArgumentException.
getEnquiryForms.summary=List enquiry forms
getEnquiryForms.description=Returns enquiry form definitions, including their kind, target groups, target condition and layout.
removeEnquiryForm.summary=Remove an enquiry form
removeEnquiryForm.description=Removes an enquiry form. dropRequests defaults to false; true also removes associated enquiry responses.
addEnquiryForm.summary=Create an enquiry form
addEnquiryForm.description=Creates an enquiry form. Preserve the mixed-case JSON names and full legacy layout clazz names in the request.
updateEnquiryForm.summary=Update an enquiry form
updateEnquiryForm.description=Updates an enquiry form. ignoreRequestsAndInvitations defaults to false. The historical ignoreInvitations parameter is accepted but unused.
getEnquiryResponses.summary=List enquiry responses
getEnquiryResponses.description=Returns flattened enquiry response states, including EntityId, collected input and timestamps in milliseconds.
getEnquiryResponse.summary=Read an enquiry response
getEnquiryResponse.description=Returns a stored enquiry response. An unknown response ID returns 400 with WrongArgumentException.
getInvitations.summary=List invitations
getInvitations.description=Returns flattened invitation objects. All invitation response timestamps use Unix milliseconds, including creationTime and lastSentTime; absent send times are omitted.
getInvitation.summary=Read an invitation
getInvitation.description=Returns one flattened invitation, with form-prefill fields alongside registrationCode and send metadata. The invitation type selects registration, enquiry or combined prefill data.
removeInvitation.summary=Remove an invitation
removeInvitation.description=Removes the invitation identified by its code.
sendInvitation.summary=Send an invitation
sendInvitation.description=Queues delivery of the stored invitation through the configured notification channel and updates send metadata.
addInvitation.summary=Create an invitation
addInvitation.description=Creates an invitation and returns its code as text/plain with status 200. The historical parser defaults missing type to REGISTRATION before subtype binding and handles other types through the enquiry parser. expiration is Unix milliseconds.
updateInvitation.summary=Update an invitation
updateInvitation.description=Updates the invitation identified by code using the same subtype parsing as creation. expiration is Unix milliseconds.
applyBulkProcessingRule.summary=Apply a bulk-processing rule
applyBulkProcessingRule.description=Applies the translation rule. A missing or negative timeout starts asynchronous execution and returns async. A nonnegative timeout waits and returns sync or timeout, all as text/plain with status 200.
importUser.summary=Import a user
importUser.description=Imports the identity through the named importer, or all applicable importers when importer is omitted. Returns individual import results.
triggerEvent.summary=Publish an event
triggerEvent.description=Publishes the event with administrative authorization. The raw request body becomes event data; the REST resource does not validate its JSON structure.
removeToken.summary=Remove a token
removeToken.description=Removes a token by type and value. Engine errors are reported using the historical invalid-token error message.
getTokens.summary=List tokens
getTokens.description=Returns tokens of the selected type, optionally restricted to an owner. created and expires are Unix milliseconds. The contents property is formatted by the token-specific serializer and can contain arbitrary JSON.
getIdpStatistics.summary=Read identity-provider statistics
getIdpStatistics.description=Returns sign-in statistics since a Unix millisecond timestamp. groupBy defaults to none; skipZeroRecords defaults to true. Local date conversion uses the server's time zone.
getGroupMembersResolved.summary=Read resolved group members
getGroupMembersResolved.description=Returns resolved entities and their attributes in the group. A missing leading slash is added to the supplied group path.
getMultiGroupMembersResolved.summary=Read resolved members across subgroups
getMultiGroupMembersResolved.description=Reads resolved entities and per-group attributes beneath the root, filtered by a JSON array of group paths. Invalid filter JSON retains the WrongArgumentException envelope.
export.summary=Export a database backup
export.description=Streams a versioned Unity JSON dump as an attachment. All category flags default to true. The temporary export file is removed after streaming.
importBackup.summary=Restore a database backup
importBackup.description=Restores a versioned Unity JSON dump. The configured or memory-based size limit is enforced against both Content-Length and actual bytes. Oversized imports return 413. A successful restore can restart the endpoint before the client receives a response.
getPolicyDocuments.summary=List policy documents
getPolicyDocuments.description=Returns all policy documents visible to the administrator, including their current revisions.
getPolicyDocument.summary=Read a policy document
getPolicyDocument.description=Reads a policy by numeric ID. An unknown document returns 404.
addPolicyDocuments.summary=Create a policy document
addPolicyDocuments.description=Creates a policy and returns its ID with status 200. The initial revision is 1. Name, displayedName, mandatory, contentType and content are required.
updatePolicyDocument.summary=Update a policy document
updatePolicyDocument.description=Requires incrementRevision before the body is parsed. True increments the revision; false preserves it. An unknown document returns 404.
deletePolicyDocument.summary=Remove a policy document
deletePolicyDocument.description=Deletes a policy by numeric ID. An unknown document returns 404.
