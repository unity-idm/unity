getProjects.summary=List managed projects
getProjects.description=Returns projects visible under the configured root. A project-scoped OAuth token sees only projects covered by its scopes.

getProject.summary=Read a project
getProject.description=Returns the project configuration. projectId is relative to the endpoint root; urlId is its URL-encoded representation for use in paths.

addProject.summary=Create a project
addProject.description=Creates a managed project. Omitting projectId, or setting it to null, generates an identifier. A nonempty displayedName is required. Project-scoped OAuth tokens cannot create projects. JSON bodies also remain accepted with text/plain or without Content-Type.

updateProject.summary=Update a project
updateProject.description=Replaces the project configuration. displayedName must be set. JSON bodies also remain accepted with text/plain or without Content-Type. A literal JSON null currently produces an empty 500 response.

removeProject.summary=Remove a project
removeProject.description=Removes the project and its related configuration using the existing project management authorization rules.

getProjectMembers.summary=List project or subgroup members
getProjectMembers.description=Omitting groupPath selects the historical project-member array containing email, role and attributes. Supplying groupPath, including an empty value for the project root, selects the entity-ID array, which also contains entityId and name and supports email:null. Both variants may be empty. A null-email member causes the historical email-shaped listing to return an empty 500 response. Use the entity-ID variant for groups containing users without email.

sendInvitations.summary=Send project invitations
sendInvitations.description=Both a project registration form and signup enquiry form must be configured. Returns one outcome for each distinct input email in input order. sent and alreadyMember have message:null; failed includes the error message and processing continues for other addresses. A failure can leave a saved invitation. expiration must be in the future and accepts ISO timestamps or numeric Unix seconds. Selected groups are paths relative to the project.

getInvitations.summary=List project invitations
getInvitations.description=Returns invitations belonging to this project. expiration and lastSentTime are numeric Unix seconds, including fractional seconds. Stored timestamps have millisecond precision.

getInvitation.summary=Read a project invitation
getInvitation.description=An invitation code belonging to another project is reported as missing.

removeInvitation.summary=Remove a project invitation
removeInvitation.description=Removes the invitation. A code belonging to another project is reported as missing.

resendInvitation.summary=Resend an invitation
resendInvitation.description=Sends the same code again. At least eight hours of validity, a usable contact address and a message template are required. Insufficient remaining validity returns 409.

reinvite.summary=Replace and resend an invitation
reinvite.description=Creates and sends a replacement invitation, then removes the old code. Refresh the invitation list to obtain the replacement code.

getGroups.summary=List the project root and subgroups
getGroups.description=Returns a flat array of the project root and its descendants, sorted by relative path. The root has path "". subGroups contains paths relative to the project.

addGroup.summary=Create a subgroup
addGroup.description=Creates a subgroup below parentPath and returns its generated relative path. An absent or empty parentPath selects the project root. displayedName must contain a nonblank localized value.

getGroup.summary=Read a subgroup by path
getGroup.description=Select a nested subgroup with a relative path such as team/workshop. An absent or empty path selects the project root.

removeGroup.summary=Remove a subgroup recursively
removeGroup.description=Recursively removes a regular group or a delegated subproject. Removing a delegated subproject also removes its related forms. The project root cannot be removed through this route.

updateGroup.summary=Update a subgroup
updateGroup.description=Updates displayed name and visibility together. path, displayedName and public are required. Use the relative path returned on creation. Update the project root through the project route.

setGroupDelegation.summary=Set subgroup delegation
setGroupDelegation.description=Sets enabled, enableSubprojects and logoUrl. Delegation follows the engine subproject rules, including inherited forms. Project-root delegation is managed through the project route.

addGroupMember.summary=Add a member by entity ID
addGroupMember.description=Adds an existing entity to the selected group and any required parent memberships. Omitting groupPath selects the project root.

getGroupMember.summary=Read a member by entity ID
getGroupMember.description=Returns the member from the selected group. Omitting groupPath selects the project root. Users without email are supported.

removeGroupMember.summary=Remove a member by entity ID
removeGroupMember.description=Removes the member from the selected group and its descendants. Removing a subgroup membership preserves membership of its parent project.

getGroupMemberRole.summary=Read a member role by entity ID
getGroupMemberRole.description=Returns the role of a member of the selected group.

setGroupMemberRole.summary=Set a member role by entity ID
setGroupMemberRole.description=Accepts regular, manager or projectsAdmin. Role changes require delegation on the selected group and preserve the rule that a project must have a manager; conflicting changes return 409.

getRequests.summary=List pending project requests
getRequests.description=Lists pending registration, signup enquiry and membership update requests. operation is SignUp or Update; type is Registration or Enquiry. groups contains relative paths. requestedTime is numeric Unix seconds, including fractional seconds.

getRequest.summary=Read a pending request
getRequest.description=Returns one pending request in this project. Missing, completed and foreign-project requests are unavailable.

decideRequest.summary=Accept or decline a pending request
decideRequest.description=Set decision to accept or decline. No request body is required. Request type and operation are resolved from the stored pending request. Missing, completed and foreign-project requests are unavailable.

getProjectMember.summary=Read a member by email
getProjectMember.description=Identifies the project member by their email address. The numeric entity-ID routes support users without email.

removeProjectMember.summary=Remove a member by email
removeProjectMember.description=Removes the user identified by email from the project.

addProjectMember.summary=Add a member by email
addProjectMember.description=Adds an existing Unity user to the project. userId is the contact email address.

getProjectMemberAuthorizationRole.summary=Read a member role by email
getProjectMemberAuthorizationRole.description=Returns the project authorization role of the member identified by email.

addProjectMemberAuthorizationRole.summary=Set a member role by email
addProjectMemberAuthorizationRole.description=Sets regular, manager or projectsAdmin for the project member. The project must retain a manager. This route preserves support for JSON with text/plain or without Content-Type.

getPolicyDocuments.summary=List project policy documents
getPolicyDocuments.description=Returns the policy documents attached to this project.

getPolicyDocument.summary=Read a project policy document
getPolicyDocument.description=A policy outside the project scope, including a detached policy, returns 403.

removePolicyDocument.summary=Remove a project policy document
removePolicyDocument.description=Removes the policy from the project. A foreign or detached policy returns 403.

addPolicyDocument.summary=Add a project policy document
addPolicyDocument.description=Creates and attaches a policy document to the project. The initial revision is 1; the response contains its numeric identifier.

updatePolicyDocument.summary=Update a project policy document
updatePolicyDocument.description=Updates an attached document. incrementRevision defaults to false; only true advances the stored revision. Access to a foreign project policy is denied with 403.

getRegistrationForm.summary=Read the project registration form
getRegistrationForm.description=Returns the project registration form. The generated schema preserves mixed-case field names and the fully qualified clazz layout discriminators.

getRegistrationFormLink.summary=Read the public registration form link
getRegistrationFormLink.description=Returns its public URL. Returns 404 if the form is absent, invitation-only or has no public link.

removeRegistrationForm.summary=Remove the project registration form
removeRegistrationForm.description=Removes the registration form. dropRequests=true also removes its pending requests. Without that flag, pending requests reject removal with 400. Existing behavior detaches the form from the project even when removal is rejected; the form and pending requests remain stored.

addRegistrationForm.summary=Create the project registration form
addRegistrationForm.description=Creates an explicit JSON registration form. With autogenerate=true, generates the form from the project configuration and ignores the body, including malformed JSON. The body is optional only when generating. Content-Type: application/json is required even for a bodyless generation request.

updateRegistrationForm.summary=Update the project registration form
updateRegistrationForm.description=Updates the existing registration form. Its Name must match the attached form. ignoreRequests=true forces an update despite pending requests; those requests remain stored and may become invalid.

getSignupEnquiryForm.summary=Read the project signup enquiry form
getSignupEnquiryForm.description=Returns the project signup enquiry form. The generated schema preserves mixed-case field names and the fully qualified clazz layout discriminators.

getSignupEnquiryLink.summary=Read the public signup enquiry form link
getSignupEnquiryLink.description=Returns its public URL. Returns 404 if the form is absent, invitation-only or has no public link.

removeSignupEnquiryForm.summary=Remove the project signup enquiry form
removeSignupEnquiryForm.description=Removes the signup enquiry form. dropRequests=true also removes its pending requests. Without that flag, pending requests reject removal with 400. Existing behavior detaches the form from the project even when removal is rejected; the form and pending requests remain stored.

addSignupEnquiryForm.summary=Create the project signup enquiry form
addSignupEnquiryForm.description=Creates an explicit JSON signup enquiry form. With autogenerate=true, generates the form from the project configuration and ignores the body, including malformed JSON. The body is optional only when generating. Content-Type: application/json is required even for a bodyless generation request.

updateSignupEnquiryForm.summary=Update the project signup enquiry form
updateSignupEnquiryForm.description=Updates the existing signup enquiry form. Its Name must match the attached form. ignoreRequests=true forces an update despite pending requests; those requests remain stored and may become invalid.

getMembershipUpdateEnquiryForm.summary=Read the project membership update enquiry form
getMembershipUpdateEnquiryForm.description=Returns the project membership update enquiry form. The generated schema preserves mixed-case field names and the fully qualified clazz layout discriminators.

getMembershipUpdateEnquiryLink.summary=Read the public membership update enquiry form link
getMembershipUpdateEnquiryLink.description=Returns its public URL. Returns 404 if the form is absent, invitation-only or has no public link.

removeMembershipUpdateEnquiryForm.summary=Remove the project membership update enquiry form
removeMembershipUpdateEnquiryForm.description=Removes the membership update enquiry form. dropRequests=true also removes its pending requests. Without that flag, pending requests reject removal with 400. Existing behavior detaches the form from the project even when removal is rejected; the form and pending requests remain stored.

addMembershipUpdateEnquiryForm.summary=Create the project membership update enquiry form
addMembershipUpdateEnquiryForm.description=Creates an explicit JSON membership update enquiry form. With autogenerate=true, generates the form from the project configuration and ignores the body, including malformed JSON. The body is optional only when generating. Content-Type: application/json is required even for a bodyless generation request.

updateMembershipUpdateEnquiryForm.summary=Update the project membership update enquiry form
updateMembershipUpdateEnquiryForm.description=Updates the existing membership update enquiry form. Use type STICKY to retain its project attachment; updating a form of another type clears the attachment. Its Name must match the attached form. ignoreRequests=true forces an update despite pending requests; those requests remain stored and may become invalid.
