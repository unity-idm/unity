SAMLAuthenticatorEditor.additionalCredentialDesc=இந்த நற்சான்றிதழ் மறைகுறியாக்குவதற்குப் பயன்படுத்தப்படலாம், ஆனால் கோரிக்கைகளில் கையொப்பமிட பயன்படுத்தப்படாது (வேறு இடங்களில் கட்டமைக்கப்பட்டால்). சான்றிதழ் ரோல்ஓவருக்கு பயனுள்ளதாக இருக்கும், அங்கு புதிய சான்றிதழ் கொண்ட நற்சான்றிதழ் இடம்பெயர்ந்தவர்களுக்கு மேனிலை தரவு பரப்புவதற்கான நேரத்திற்கு இங்கே கட்டமைக்கப்பட்டுள்ளது.
